name: Synthetic Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows PowerShell synthetic tests
        shell: powershell
        run: ./tests/Test-BackupGuard.ps1
      - name: PowerShell Core synthetic tests
        shell: pwsh
        run: ./tests/Test-BackupGuard.ps1
