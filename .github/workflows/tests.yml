name: Synthetic Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse and test without disk operations
        shell: ${{ matrix.shell }}
        run: ./tests/Test-BackupGuard.ps1
